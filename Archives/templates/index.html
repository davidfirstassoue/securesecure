{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <div class="glass-panel auth-box">
        <h2 style="text-align: center; margin-bottom: 0.5rem;">Secure<span style="color: var(--neon-cyan)">Share</span>
        </h2>
        <p class="tech-text" style="text-align: center; margin-bottom: 2rem;">[ ENCRYPTED_CONNECTION_ESTABLISHED ]</p>

        <div class="auth-tabs">
            <div class="auth-tab active" id="tab-login">Connexion</div>
            <div class="auth-tab" id="tab-signup">Inscription</div>
        </div>

        <!-- Login Form -->
        <form class="auth-form active" id="form-login" action="{{ url_for('login') }}" method="POST">
            <div class="input-group">
                <label for="login-email">Identifiant ou Email</label>
                <input type="text" id="login-email" name="email" required placeholder="nom@etudiant.univ.fr">
            </div>
            <div class="input-group">
                <label for="login-password">Mot de passe chiffré</label>
                <input type="password" id="login-password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn">Authentification Sécurisée</button>
        </form>

        <!-- Signup Form -->
        <form class="auth-form" id="form-signup" action="{{ url_for('signup') }}" method="POST">
            <div class="input-group">
                <label for="signup-name">Nom Complet</label>
                <input type="text" id="signup-name" name="name" required placeholder="Ex: Alice Dupont">
            </div>
            <div class="input-group">
                <label for="signup-email">Email Académique</label>
                <input type="email" id="signup-email" name="email" required placeholder="nom@etudiant.univ.fr">
            </div>
            <div class="input-group">
                <label for="signup-role">Rôle / Accès</label>
                <select id="signup-role" name="role">
                    <option value="student">Étudiant(e)</option>
                    <option value="admin">Membre de l'administration</option>
                </select>
            </div>
            <div class="input-group">
                <label for="signup-password">Générer mot de passe</label>
                <input type="password" id="signup-password" name="password" required
                    placeholder="Utilisez une phrase secrète forte">
            </div>

            <div class="file-drop-area" id="id-drop-zone">
                <div class="icon">📄</div>
                <p>Déposez votre justificatif ici</p>
                <p class="tech-text" style="font-size: 0.75rem;">(Carte étudiant ou badge admin - PDF/IMG)</p>
                <input type="file" id="id-file" class="hidden" accept=".pdf,image/*">
            </div>

            <button type="submit" class="btn">Créer mon compte chiffré</button>
        </form>
    </div>
</div>
{% endblock %}
